# MIRA Hub on hub.mira-intelligence.com — server blocks appended to the docs
# nginx on the mira-intelligence CVM (/opt/mira-docs/nginx.conf, container
# `mira-docs`, which owns ports 80/443 behind Tencent EdgeOne).
#
# The static export lives at /opt/mira-hub/site on the host, mounted read-only
# into the container at /usr/share/nginx/hub (see deploy/README.md). CI rsyncs
# a fresh build there; nginx needs no reload for content updates.
#
# EdgeOne must send the original Host (hub.mira-intelligence.com) to the
# origin, otherwise requests fall through to the docs default_server.

# ---------- HTTP :80 (EdgeOne origin-pull + ACME) ----------
server {
  listen 80;
  server_name hub.mira-intelligence.com;

  root /usr/share/nginx/hub;
  index index.html;
  error_page 404 /404.html;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Content-hashed Next.js assets never change under the same name.
  location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Registry index and skill zips: engines fetch these (hub_search / hub_install).
  location ^~ /registry/ {
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  # HTML pages: revalidate so a new build shows up right away.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ $uri.html =404;
  }
}

# ---------- HTTPS :443 (origin TLS for EdgeOne HTTPS origin-pull / direct) ----------
# The shared certificate must list hub.mira-intelligence.com
# (certbot --expand, see deploy/README.md).
server {
  listen 443 ssl;
  http2 on;
  server_name hub.mira-intelligence.com;

  ssl_certificate     /etc/letsencrypt/live/mira-intelligence.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mira-intelligence.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  root /usr/share/nginx/hub;
  index index.html;
  error_page 404 /404.html;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /registry/ {
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ $uri.html =404;
  }
}
