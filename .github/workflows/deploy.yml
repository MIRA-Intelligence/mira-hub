name: deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [skills-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mira-hub
        uses: actions/checkout@v4
        with:
          path: mira-hub

      - name: Checkout mira-skills
        uses: actions/checkout@v4
        with:
          repository: MIRA-Intelligence/mira-skills
          ref: main
          path: mira-skills

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mira-hub/package-lock.json

      - name: Install deps
        working-directory: mira-hub
        run: npm ci

      - name: Build registry
        working-directory: mira-hub
        env:
          MIRAHUB_BASE_PATH: /mira-hub
          MIRAHUB_BASE_URL: https://mira-intelligence.github.io
        run: npm run build:registry -- --skills-dir ../mira-skills/skills

      - name: Build site
        working-directory: mira-hub
        env:
          MIRAHUB_BASE_PATH: /mira-hub
          MIRAHUB_BASE_URL: https://mira-intelligence.github.io
        run: npm run build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mira-hub/packages/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
