name: deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [skills-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mira-hub
        uses: actions/checkout@v4
        with:
          path: mira-hub

      - name: Checkout mira-skills
        uses: actions/checkout@v4
        with:
          repository: MIRA-Intelligence/mira-skills
          ref: main
          path: mira-skills

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mira-hub/package-lock.json

      - name: Install deps
        working-directory: mira-hub
        run: npm ci

      - name: Build registry
        working-directory: mira-hub
        env:
          MIRAHUB_BASE_PATH: /mira-hub
          MIRAHUB_BASE_URL: https://mira-intelligence.github.io
        run: npm run build:registry -- --skills-dir ../mira-skills/skills

      - name: Build site
        working-directory: mira-hub
        env:
          MIRAHUB_BASE_PATH: /mira-hub
          MIRAHUB_BASE_URL: https://mira-intelligence.github.io
        run: npm run build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mira-hub/packages/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Second copy of the site on hub.mira-intelligence.com (Tencent Cloud CVM
  # behind EdgeOne), built for the domain root. Skipped until the repo has
  # vars HUB_DEPLOY_HOST / HUB_DEPLOY_USER / HUB_DEPLOY_KNOWN_HOSTS and
  # secret HUB_DEPLOY_KEY; server setup is in deploy/README.md.
  cloud:
    if: ${{ vars.HUB_DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    environment:
      name: hub-cloud
      url: https://hub.mira-intelligence.com/
    steps:
      - name: Checkout mira-hub
        uses: actions/checkout@v4
        with:
          path: mira-hub

      - name: Checkout mira-skills
        uses: actions/checkout@v4
        with:
          repository: MIRA-Intelligence/mira-skills
          ref: main
          path: mira-skills

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mira-hub/package-lock.json

      - name: Install deps
        working-directory: mira-hub
        run: npm ci

      - name: Build registry and site
        working-directory: mira-hub
        env:
          MIRAHUB_BASE_PATH: /
          MIRAHUB_BASE_URL: https://hub.mira-intelligence.com
        run: |
          npm run build:registry -- --skills-dir ../mira-skills/skills
          npm run build:web

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.HUB_DEPLOY_KEY }}" > ~/.ssh/id_deploy
          printf '%s\n' "${{ vars.HUB_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The key is pinned server-side to `rrsync /opt/mira-hub/site`, so the
      # destination is relative to that folder. --delay-updates swaps files in
      # at the end; nginx serves the new build without a reload.
      - name: Upload site
        working-directory: mira-hub
        run: |
          rsync -rltz --delete --delay-updates \
            -e "ssh -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes" \
            packages/web/out/ \
            "${{ vars.HUB_DEPLOY_USER }}@${{ vars.HUB_DEPLOY_HOST }}:"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
